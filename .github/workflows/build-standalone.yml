name: Build standalone

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repository checks
        shell: powershell
        run: .\scripts\check-repository.ps1
      - name: Build
        shell: powershell
        run: .\build-standalone.ps1
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: music-practice-kit-dist
          path: dist/
